t><line x1="182" y1="325.15000000000003" x2="509" y2="325.15000000000003" stroke="#C9D3D0" stroke-width="1"/><line x1="582" y1="325.15000000000003" x2="909" y2="325.15000000000003" stroke="#C9D3D0" stroke-width="1"/><line x1="982" y1="325.15000000000003" x2="1309" y2="325.15000000000003" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="298.20000000000005" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">D17  102 m</text><line x1="182" y1="293.20000000000005" x2="509" y2="293.20000000000005" stroke="#C9D3D0" stroke-width="1"/><line x1="582" y1="293.20000000000005" x2="909" y2="293.20000000000005" stroke="#C9D3D0" stroke-width="1"/><line x1="982" y1="293.20000000000005" x2="1309" y2="293.20000000000005" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="266.25" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">D18  106.5 m</text><line x1="182" y1="261.25" x2="509" y2="261.25" stroke="#C9D3D0" stroke-width="1"/><line x1="582" y1="261.25" x2="909" y2="261.25" stroke="#C9D3D0" stroke-width="1"/><line x1="982" y1="261.25" x2="1309" y2="261.25" stroke="#C9D3D0" stroke-width="1"/><text x="182" y="205" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">81 luxury units shipwide; exact locations and upper roof clearance remain unresolved.</text><text x="62" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Section is schematic across three neighborhoods; it does not project one continuous private hotel volume.</text><text x="62" y="781" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">Dashed guest/service cores show connection intent only. Shafts and</text><text x="62" y="804.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">penetrations remain unlocated. Preserve theater openings D12-D14 and</text><text x="62" y="827.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">gallery interfaces D12/D13.</text><text x="765" y="781" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Multistory luxury units must reconcile occupied levels, clear heights</text><text x="765" y="804.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">and a single bookable identity. No second floor or expanded room adds</text><text x="765" y="827.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">a guest unit or establishes permitted passenger capacity.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Exact Y levels retained. Colored program layers describe ownership/use, not measured room-area availability or structural feasibility.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  03</text></svg>