<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 5</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Public vertical anchors and the remaining fit decisions</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">The preferred hybrid links to real destinations. Historical planar alignment is useful evidence; it is not permission for a new void, water route or floor</text><text x="62" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">opening.</text><text x="62" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">Moonwell has a corroborated historical stack</text><text x="62" y="206" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">All three allocations share X -54..-8 and Z -250..-182 in the atlas:</text><rect x="62" y="263" width="610" height="71" fill="#E8D7A8" stroke="#203F48" stroke-width="1.3"/><text x="79" y="292" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">D10   Lantern restaurant</text><text x="79" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D10_banquet2 | 240 recorded places</text><rect x="62" y="352" width="610" height="71" fill="#CBDCE5" stroke="#203F48" stroke-width="1.3"/><text x="79" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">D09   Paper Moon books</text><text x="79" y="408" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D09_books2 | retained public bookshop</text><rect x="62" y="441" width="610" height="71" fill="#BDD2BD" stroke="#203F48" stroke-width="1.3"/><text x="79" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">D08   Mineral springs</text><text x="79" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D08_bath2 | retained aquatic destination</text><text x="62" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">Keep these rooms and their public access. Connect the forward</text><text x="62" y="586.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">hotel neighborhoods to the shared stack through the existing ship</text><text x="62" y="611.6800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">network and proposed local arrival links. Internal Moonwell shafts,</text><text x="62" y="636.5200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">sculpted contours and openings remain unrecovered.</text><text x="62" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">Vesper requires the missing change record</text><text x="62" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Vesper dining and D08 Gentle waters align at X +8..+54 / Z</text><text x="62" y="769.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">+182..+250. The old D09 Living gifts allocation lies between them.</text><text x="62" y="792.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Preserve all three until the later two-level/waterfall revision is</text><text x="62" y="816.3800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">reconciled.</text><text x="769" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">Hard evidence gates before physical layout</text><text x="769" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#547F80" font-weight="700" text-anchor="start">1</text><text x="806" y="214" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Recover ID-to-room geometry</text><text x="806" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Actual room polygons, doors, beds, floor aliases and the</text><text x="806" y="264.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">accepted pre-loss changes.</text><text x="769" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#547F80" font-weight="700" text-anchor="start">2</text><text x="806" y="326" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Reconcile 1,000 units and 81 luxury</text><text x="806" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Exact unit sizes, berths, tier IDs and multistory ownership; no</text><text x="806" y="376.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">capacity inferred from footprint counts.</text><text x="769" y="438" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#547F80" font-weight="700" text-anchor="start">3</text><text x="806" y="438" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Fit the local circulation</text><text x="806" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Distinct guest/service shafts, landings, turning space, moving</text><text x="806" y="488.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">doors and supported paths.</text><text x="769" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#547F80" font-weight="700" text-anchor="start">4</text><text x="806" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Verify the upper envelope</text><text x="806" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Local hull/roof profile, usable headroom and structural/service</text><text x="806" y="600.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">depth.</text><text x="769" y="662" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#547F80" font-weight="700" text-anchor="start">5</text><text x="806" y="662" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Preserve useful existing programs</text><text x="806" y="689" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Any genuine change to a protected footprint, interface or</text><text x="806" y="712.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">capacity needs an explicit decision.</text><text x="769" y="809" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">The D09 connected component kit can progress with adjustable</text><text x="769" y="832.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">interfaces while these ship-level checks remain open.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Moonwell/Vesper: atlas pp. 10-12 plus historical conversation. Name equivalence and later modifications remain explicitly subject to review.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  05</text></svg>