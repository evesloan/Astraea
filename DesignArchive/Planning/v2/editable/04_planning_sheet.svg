<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 4</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Before and after   preserve the affected public program</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">The hybrid removes the assumption that a hotel outline owns its full vertical projection. All listed public footprints, IDs and recorded capacities are</text><text x="62" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">retained.</text><rect x="62" y="163" width="321" height="42" fill="#203F48" stroke="none" stroke-width="1"/><text x="74" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">v1 intersection</text><rect x="383" y="163" width="434" height="42" fill="#203F48" stroke="none" stroke-width="1"/><text x="395" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Retained allocation / capacity</text><rect x="817" y="163" width="561" height="42" fill="#203F48" stroke="none" stroke-width="1"/><text x="829" y="190" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">v2 disposition</text><rect x="62" y="205" width="321" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">A1 / A2 on D09</text><rect x="383" y="205" width="434" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Orchard market; Thread &amp; shell</text><rect x="817" y="205" width="561" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Shared public retail base. No storefront or function removed.</text><rect x="62" y="264" width="321" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">A1 / A2 on D10</text><rect x="383" y="264" width="434" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Shared table 240; Orchard food hall 240</text><rect x="817" y="264" width="561" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Retain both complete venues and reservations; hotel identity grants</text><text x="829" y="302" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">no exclusive ownership.</text><rect x="62" y="323" width="321" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">A1 / A2 on D11</text><rect x="383" y="323" width="434" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Music room; Cinemas 2 and 3, 200 each</text><rect x="817" y="323" width="561" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Public culture remains continuous. Local hotel cores must find space</text><text x="829" y="361" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">without taking those envelopes.</text><rect x="62" y="382" width="321" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">A1 / B1 on D12</text><rect x="383" y="382" width="434" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Horizon room; Listening salon</text><rect x="817" y="382" width="561" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Retain public entries and quiet destination use beneath/alongside the</text><text x="829" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">forward port neighborhood.</text><rect x="62" y="441" width="321" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">A2 / B2 on D12</text><rect x="383" y="441" width="434" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Stillroom; Long library</text><rect x="817" y="441" width="561" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Retain public entries and library activity. Link by wayfinding to forward</text><text x="829" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">starboard arrival.</text><rect x="62" y="500" width="321" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">A3 / B3 / B4 on D12</text><rect x="383" y="500" width="434" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Many worlds gallery; Reading nooks</text><rect x="817" y="500" width="561" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="519" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Retain public programs serving both aft wings and the rest of the ship.</text><rect x="62" y="559" width="321" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="578" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Forward commons D13-D17</text><rect x="383" y="559" width="434" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="578" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Entire port and starboard forward commons</text><rect x="817" y="559" width="561" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="578" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Use as shared arrival/court anchors. No boundary cuts or assumed</text><text x="829" y="597" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">privatization.</text><rect x="62" y="618" width="321" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Guest footprint boundary cuts</text><rect x="383" y="618" width="434" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Complete historical allocations retained</text><rect x="817" y="618" width="561" height="59" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Remove clipped boundary fragments from the study. Affiliation</text><text x="829" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">remains provisional until IDs and actual contours return.</text><rect x="62" y="677" width="321" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="696" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Aft commons outside v1 masks</text><rect x="383" y="677" width="434" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="395" y="696" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Entire port and starboard aft commons</text><rect x="817" y="677" width="561" height="59" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="829" y="696" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Include them as retained shared arrival anchors, without changing</text><text x="829" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">either physical allocation.</text><text x="62" y="791" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">Disposition is a planning commitment to preserve these allocations. It does not prove a new core fits, that the final guest polygon is recovered,</text><text x="62" y="815.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">or that a hotel can accommodate its eventual unit mix.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Named allocations matched to atlas directories and source IDs. Full before/after records and exact bounds are in the editable disposition ledger.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  04</text></svg>