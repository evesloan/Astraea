<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 2</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Arrival and service relationships</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Use retained commons as shared arrival places. Proposed local cores connect neighborhoods; their shafts, doors, capacity and structural fit remain</text><text x="62" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">unallocated.</text><rect x="62" y="162" width="340" height="126" fill="#EBECE5" stroke="#203F48" stroke-width="1.3"/><text x="79" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Existing ship arrival</text><text x="79" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Townline fore Z -432 / aft +432</text><text x="79" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Current express deck travel retained</text><text x="79" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Public access stays available</text><rect x="529" y="162" width="352" height="126" fill="#E8D7A8" stroke="#203F48" stroke-width="1.3"/><text x="546" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Public district destinations</text><text x="546" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D09 retail / D10 dining / D11 culture</text><text x="546" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D12 Horizon, libraries and salons</text><text x="546" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Moonwell stack remains a shared</text><text x="546" y="284" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">anchor</text><rect x="1008" y="162" width="370" height="126" fill="#CBDCE5" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="1025" y="191" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Proposed local guest core</text><text x="1025" y="218" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Legible hotel arrival and wayfinding</text><text x="1025" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Connect to stacked commons</text><text x="1025" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">No shaft footprint selected</text><line x1="405" y1="225" x2="521" y2="225" stroke="#547F80" stroke-width="3"/><polygon points="521,225 513.1017569429866,229.31482984743784 513.1017569429866,220.68517015256216" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="885" y1="225" x2="1000" y2="225" stroke="#547F80" stroke-width="3" stroke-dasharray="7,5"/><polygon points="1000,225 992.1017569429866,229.31482984743784 992.1017569429866,220.68517015256216" fill="#547F80" stroke="#547F80" stroke-width="1"/><text x="62" y="337" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#203F48" font-weight="700" text-anchor="start">Retained commons and upper home relationships</text><text x="62" y="382" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#547F80" font-weight="700" text-anchor="start">F-P</text><text x="139" y="382" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Port forward commons on D13-D17</text><text x="139" y="408" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X -97..-63 / Z -384..-356</text><line x1="668" y1="387" x2="758" y2="387" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><polygon points="758,387 750.1017569429866,391.3148298474378 750.1017569429866,382.6851701525622" fill="#547F80" stroke="#547F80" stroke-width="1"/><text x="783" y="385" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="400" text-anchor="start">Quiet forward cluster</text><text x="783" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Whole allocations; exact unit affiliation and views unresolved</text><text x="62" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#547F80" font-weight="700" text-anchor="start">F-S</text><text x="139" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Starboard forward commons on D13-D17</text><text x="139" y="490" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X +63..+97 / Z -384..-356</text><line x1="668" y1="469" x2="758" y2="469" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><polygon points="758,469 750.1017569429866,473.3148298474378 750.1017569429866,464.6851701525622" fill="#547F80" stroke="#547F80" stroke-width="1"/><text x="783" y="467" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="400" text-anchor="start">Forward social / family cluster</text><text x="783" y="492" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Whole allocations; exact unit affiliation and views unresolved</text><text x="62" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#547F80" font-weight="700" text-anchor="start">A-P</text><text x="139" y="546" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Port aft commons on D13-D17</text><text x="139" y="572" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X -97..-63 / Z +356..+384</text><line x1="668" y1="551" x2="758" y2="551" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><polygon points="758,551 750.1017569429866,555.3148298474379 750.1017569429866,546.6851701525621" fill="#547F80" stroke="#547F80" stroke-width="1"/><text x="783" y="549" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="400" text-anchor="start">Aft court-facing homes</text><text x="783" y="574" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Whole allocations; exact unit affiliation and views unresolved</text><text x="62" y="628" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#547F80" font-weight="700" text-anchor="start">A-S</text><text x="139" y="628" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Starboard aft commons on D13-D17</text><text x="139" y="654" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X +63..+97 / Z +356..+384</text><line x1="668" y1="633" x2="758" y2="633" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><polygon points="758,633 750.1017569429866,637.3148298474379 750.1017569429866,628.6851701525621" fill="#547F80" stroke="#547F80" stroke-width="1"/><text x="783" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="400" text-anchor="start">Aft court-facing homes</text><text x="783" y="656" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Whole allocations; exact unit affiliation and views unresolved</text><text x="62" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#B76543" font-weight="700" text-anchor="start">Separate staff route</text><text x="62" y="786" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">D03 crew / D01 supplies -&gt; existing service network -&gt; proposed local service core -&gt; floor support edge. Keep cart access, guest privacy and</text><text x="62" y="810.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">both public/service door mechanisms distinct. Exact landings and apertures remain unknown.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Relationship diagram only. Commons bounds are historical atlas allocations. Dashed links are proposed; they certify no walking or lift path.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  02</text></svg>