<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 4</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">D12 transfer level and upper section strategy</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Start the proposed local cores at D12 to retain the D11 Music allocation. Express and Townline remain the documented travel interfaces while these</text><text x="62" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">interfaces are unresolved.</text><rect x="62" y="183" width="715.4" height="248.2" fill="#F0F0E9" stroke="#C9D3D0" stroke-width="1"/><rect x="105.8" y="223.15" width="248.2" height="167.9" fill="#E8D7A8" stroke="#203F48" stroke-width="0.55"/><rect x="500.0" y="223.15" width="248.2" height="167.9" fill="#E8D7A8" stroke="#203F48" stroke-width="0.55"/><rect x="62.0" y="391.78" width="715.4" height="16.79" fill="#BFD7C2" stroke="none" stroke-width="0.8"/><rect x="62.0" y="203.075" width="715.4" height="18.25" fill="#A5ADB9" stroke="none" stroke-width="0.8"/><rect x="397.8" y="274.25" width="29.2" height="21.9" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="427.0" y="274.25" width="14.6" height="21.9" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="397.8" y="223.15" width="29.2" height="21.9" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="427.0" y="223.15" width="14.6" height="21.9" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="441.59999999999997" y="274.25" width="29.2" height="125.925" fill="none" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><rect x="427.0" y="221.325" width="14.6" height="1.825" fill="none" stroke="#B76543" stroke-width="2" stroke-dasharray="3,2"/><line x1="229.9" y1="400.17499999999995" x2="456.2" y2="400.17499999999995" stroke="#547F80" stroke-width="2"/><polygon points="456.2,400.17499999999995 448.30175694298663,404.48982984743776 448.30175694298663,395.86017015256215" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="456.2" y1="400.17499999999995" x2="456.2" y2="285.2" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><polygon points="456.2,285.2 460.5148298474378,293.09824305701335 451.8851701525622,293.09824305701335" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="456.2" y1="285.2" x2="434.3" y2="285.2" stroke="#547F80" stroke-width="2" stroke-dasharray="6,4"/><polygon points="434.3,285.2 442.19824305701337,280.8851701525622 442.19824305701337,289.5148298474378" fill="#547F80" stroke="#547F80" stroke-width="1"/><text x="160.55" y="318.04999999999995" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="middle">Horizon room</text><text x="624.1" y="318.04999999999995" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="middle">Listening salon</text><circle cx="229.9" cy="391.04999999999995" r="3" fill="#203F48" stroke="#203F48" stroke-width="1"/><circle cx="624.1" cy="391.04999999999995" r="3" fill="#203F48" stroke="#203F48" stroke-width="1"/><text x="62" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Historical public entries stay on the port sidewalk; both destinations retain their full footprints.</text><text x="829" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">D12 approach proposals</text><text x="829" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Guest: new 8 m spur at Z -374..-366, X -40..-5.5, linking the</text><text x="829" y="237" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">known port sidewalk to the guest landing. The historical D12</text><text x="829" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">transverse ribbons are elsewhere; this spur is not recovered</text><text x="829" y="285" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">geometry.</text><text x="829" y="338" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Staff: a 0.5 m long x 4 m wide threshold link from the service</text><text x="829" y="362" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">ribbon edge X -54.5 to the service landing at X -54. The ribbon</text><text x="829" y="386" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">stays open. Exact wall, door, cart turning and support</text><text x="829" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">conditions need recovery.</text><text x="62" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">Proposed vertical travel range   exact floor datums</text><line x1="177" y1="792.0" x2="687" y2="792.0" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="796.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D11  69.5</text><line x1="177" y1="743.55" x2="687" y2="743.55" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="747.55" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D12  78</text><line x1="177" y1="709.35" x2="687" y2="709.35" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="713.35" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D13  84</text><line x1="177" y1="683.7" x2="687" y2="683.7" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="687.7" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D14  88.5</text><line x1="177" y1="658.05" x2="687" y2="658.05" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="662.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D15  93</text><line x1="177" y1="632.4" x2="687" y2="632.4" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="636.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D16  97.5</text><line x1="177" y1="606.75" x2="687" y2="606.75" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="610.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D17  102</text><line x1="177" y1="581.1" x2="687" y2="581.1" stroke="#C9D3D0" stroke-width="1"/><text x="152" y="585.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">D18  106.5</text><rect x="243" y="606.75" width="117" height="136.79999999999995" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="6,4"/><text x="301" y="663.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="middle">Guest</text><rect x="243" y="581.1" width="117" height="25.649999999999977" fill="none" stroke="#B76543" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="464" y="606.75" width="117" height="136.79999999999995" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="6,4"/><text x="522" y="663.05" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="middle">Service</text><rect x="464" y="581.1" width="117" height="25.649999999999977" fill="none" stroke="#B76543" stroke-width="1.5" stroke-dasharray="3,3"/><text x="715" y="585.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#B76543" font-weight="700" text-anchor="start">Headroom and D18 interface unknown</text><text x="715" y="611.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="start">D13-D17 commons levels remain complete</text><text x="715" y="683.7" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">No lift speed, cabin count or capacity assigned</text><text x="715" y="748.55" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#B76543" font-weight="700" text-anchor="start">D12 base Y78: pit and slab/support fit unresolved</text><text x="243" y="782.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="start">D11 Music remains below</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Section shows intended connection range, not built shafts or slab openings. Upper hull, roof clearance, machinery and fire/egress provisions are unverified.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  04</text></svg>