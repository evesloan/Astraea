<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 3</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Why the first full-height placements fail</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Room rectangles alone miss circulation conflicts. Two rejected reservations explain why the preferred test moves inboard and begins above D11.</text><text x="62" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">R1  At the commons edge</text><text x="770" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">R2  Straight inboard stack</text><rect x="62" y="191" width="329.0" height="300.8" fill="#F0F0E9" stroke="#C9D3D0" stroke-width="1"/><rect x="62.0" y="332.0" width="47.0" height="159.8" fill="#E8D7A8" stroke="#203F48" stroke-width="0.55"/><rect x="109.0" y="219.2" width="56.400000000000006" height="56.400000000000006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="231.20000000000002" y="219.2" width="56.400000000000006" height="56.400000000000006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="353.40000000000003" y="219.2" width="37.6" height="56.400000000000006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="62.0" y="306.15" width="329.0" height="23.5" fill="#A5ADB9" stroke="none" stroke-width="0.8"/><rect x="165.4" y="294.4" width="37.6" height="28.200000000000003" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="203.0" y="289.7" width="18.8" height="42.300000000000004" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="278.20000000000005" y="294.4" width="37.6" height="28.200000000000003" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="259.4" y="289.7" width="18.8" height="42.300000000000004" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="165.4" y="306.15" width="37.6" height="16.45" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><rect x="203.0" y="306.15" width="18.8" height="23.5" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><rect x="278.20000000000005" y="306.15" width="37.6" height="16.45" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><rect x="259.4" y="306.15" width="18.8" height="23.5" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><text x="62" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D09 representative service/staff ribbon</text><text x="428" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Protected ribbon</text><text x="428" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">X -59.5..-54.5</text><text x="428" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">5 m drawn width</text><text x="428" y="299" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">D09-D12</text><text x="428" y="362" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">Each core overlaps 28 m2;</text><text x="428" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">each landing overlaps 20 m2</text><text x="428" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">of the ribbon on every</text><text x="428" y="437" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">screened lower deck.</text><rect x="770" y="191" width="329.0" height="300.8" fill="#F0F0E9" stroke="#C9D3D0" stroke-width="1"/><rect x="882.8" y="332.0" width="216.20000000000002" height="159.8" fill="#E8D7A8" stroke="#203F48" stroke-width="0.55"/><rect x="770.0" y="306.15" width="329.0" height="23.5" fill="#A5ADB9" stroke="none" stroke-width="0.8"/><rect x="873.4" y="397.8" width="37.6" height="28.200000000000003" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="911.0" y="397.8" width="18.8" height="28.200000000000003" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="873.4" y="332.0" width="37.6" height="28.200000000000003" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="911.0" y="332.0" width="18.8" height="28.200000000000003" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><rect x="882.8" y="397.8" width="28.200000000000003" height="28.200000000000003" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><rect x="911.0" y="397.8" width="18.8" height="28.200000000000003" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><rect x="882.8" y="332.0" width="28.200000000000003" height="28.200000000000003" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><rect x="911.0" y="332.0" width="18.8" height="28.200000000000003" fill="#C77B6E" stroke="#B76543" stroke-width="1"/><text x="770" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D11 Music room remains protected</text><text x="1133" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Music room</text><text x="1133" y="241" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">X -54..-8</text><text x="1133" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Z -384..-316</text><text x="1133" y="299" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">D11_music</text><text x="1133" y="362" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">The twin cores and their</text><text x="1133" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">landings would overlap</text><text x="1133" y="412" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">120 m2 of its historical</text><text x="1133" y="437" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="400" text-anchor="start">allocation in total.</text><text x="62" y="558" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Gray matches the service/staff legend; service-route meaning is inferred. Drawn width is not certified clear width.</text><text x="62" y="600" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">Disposition</text><text x="62" y="631" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="400" text-anchor="start">Reject R1: keep the service/staff ribbon continuous. Reject R2 as a D09-D17 stack: retain the Music room and its public access.</text><text x="62" y="660" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="400" text-anchor="start">R3 uses the same inboard twin-bay plan only from D12 upward, with separately proposed lower-level approach links.</text><text x="62" y="737" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">No hidden permission to occupy the gap</text><text x="62" y="774" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">A clear 2D overlay is only a candidate. Unshown structure, service equipment, final room walls, fire/egress needs, lift pits and ceiling zones</text><text x="62" y="798.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">may still occupy or constrain it. No floor openings or host edits are made.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Overlap areas describe geometric conflicts, never room counts, lost capacity or approval to relocate an allocation. Protected capacities remain unchanged.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  03</text></svg>