006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="179.81999999999988" y="415.515" width="30.960000000000193" height="55.47000000000002" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="859.2199999999999" y="415.515" width="2.5800000000000978" height="55.47000000000002" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="179.81999999999988" y="488.61499999999995" width="30.960000000000193" height="55.470000000000006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="859.2199999999999" y="488.61499999999995" width="2.5800000000000978" height="55.470000000000006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="148.0" y="415.515" width="30.95999999999995" height="55.47000000000002" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="148.0" y="488.61499999999995" width="30.95999999999995" height="55.470000000000006" fill="#D7DDD8" stroke="#203F48" stroke-width="0.55"/><rect x="62.0" y="635.46" width="799.8" height="19.779999999999998" fill="#BFD7C2" stroke="none" stroke-width="0.8"/><rect x="517.8" y="196.0" width="34.4" height="516.0" fill="#BFD7C2" stroke="none" stroke-width="0.8"/><rect x="62.0" y="471.2" width="799.8" height="17.2" fill="#BFD7C2" stroke="none" stroke-width="0.8"/><rect x="474.79999999999995" y="251.9" width="120.39999999999999" height="146.2" fill="#E8D7A8" stroke="#203F48" stroke-width="1.6"/><text x="535.0" y="320.7" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="middle">COMMONS</text><text x="535.0" y="350.79999999999995" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="middle">X -97..-63</text><line x1="268.4" y1="669.0" x2="861.8" y2="669.0" stroke="#B76543" stroke-width="2"/><circle cx="268.4" cy="669.0" r="7" fill="#F8F6EF" stroke="#B76543" stroke-width="2"/><text x="268.4" y="703.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#B76543" font-weight="700" text-anchor="middle">Townline -432</text><line x1="268.4" y1="669.0" x2="268.4" y2="645.3499999999999" stroke="#B76543" stroke-width="3" stroke-dasharray="4,4"/><line x1="268.4" y1="645.3499999999999" x2="535.0" y2="645.3499999999999" stroke="#547F80" stroke-width="3"/><polygon points="535.0,645.3499999999999 527.1017569429866,649.6648298474378 527.1017569429866,641.035170152562" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="535.0" y1="645.3499999999999" x2="535.0" y2="398.1" stroke="#547F80" stroke-width="3"/><polygon points="535.0,398.1 539.3148298474379,405.9982430570134 530.6851701525621,405.9982430570134" fill="#547F80" stroke="#547F80" stroke-width="1"/><circle cx="535.0" cy="398.1" r="6" fill="#F8F6EF" stroke="#203F48" stroke-width="2"/><text x="255.5" y="608.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#547F80" font-weight="700" text-anchor="start">62 m along sidewalk</text><text x="633.9" y="518.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">57.5 m</text><text x="105.0" y="458.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Local lane X -44</text><text x="62" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">BOW toward Z -541  |  PORT at top  |  dimensions in metres</text><text x="62" y="742" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D13 representative; the same route ribbons and commons datum recur on D14-D17.</text><text x="928" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">Historical evidence</text><text x="928" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Townline stop</text><text x="928" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Plotted center: X 0, Z -432. The logical boarding</text><text x="928" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">vestibule and its actual exit geometry are missing.</text><text x="928" y="324" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Public sidewalk</text><text x="928" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">X -5.5 centerline; 4.6 m drawn width. Existing upper</text><text x="928" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">branch starts at Z -370.</text><text x="928" y="424" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Commons threshold</text><text x="928" y="451" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Door marker at X -63, Z -370. Preserve the whole 8</text><text x="928" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">m transverse ribbon and the existing door interface.</text><text x="928" y="524" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">Residential branch</text><text x="928" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Local lane at X -44; 4 m drawn width. Guest</text><text x="928" y="575" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">rectangles and their assigned IDs remain separate</text><text x="928" y="599" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">evidence.</text><text x="62" y="792" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">119.5 m of route is traceable along historical ribbons. The 5.5 m stop-to-sidewalk offset is only a proposed connection line. Neither distance</text><text x="62" y="816.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">certifies a traversable route or boarding fit.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Evidence: atlas pp. 15-19 vector paths and door marker; atlas p. 2 limits. No new room affiliation or unit capacity is assigned.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  01</text></svg>