<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 2</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Preferred test   two upper core bays beside the shared route</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">New reservation coordinates are test inputs. The bays start at D12 and serve the D13-D17 commons stack in principle; mechanism, structural and</text><text x="62" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">headroom fit remain open.</text><rect x="62" y="162" width="487.19999999999993" height="626.4" fill="#F0F0E9" stroke="#C9D3D0" stroke-width="1"/><rect x="201.2" y="188.1" width="243.59999999999997" height="295.79999999999995" fill="#E8D7A8" stroke="#203F48" stroke-width="0.55"/><rect x="288.2" y="162.0" width="69.6" height="626.4" fill="#BFD7C2" stroke="none" stroke-width="0.8"/><rect x="62.0" y="631.8" width="487.19999999999993" height="34.8" fill="#BFD7C2" stroke="none" stroke-width="0.8"/><rect x="201.2" y="188.1" width="243.59999999999997" height="295.79999999999995" fill="#E8D7A8" stroke="#203F48" stroke-width="1.5"/><rect x="183.79999999999998" y="684.0" width="69.6" height="52.199999999999996" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><text x="218.6" y="715.0999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="700" text-anchor="middle">G</text><rect x="253.39999999999998" y="684.0" width="34.8" height="52.199999999999996" fill="#CBDCE5" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><text x="270.79999999999995" y="715.0999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="700" text-anchor="middle">GL</text><rect x="183.79999999999998" y="562.2" width="69.6" height="52.199999999999996" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><text x="218.6" y="593.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="700" text-anchor="middle">S</text><rect x="253.39999999999998" y="562.2" width="34.8" height="52.199999999999996" fill="#D6BCC7" stroke="#547F80" stroke-width="1.5" stroke-dasharray="5,3"/><text x="270.79999999999995" y="593.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="700" text-anchor="middle">SL</text><circle cx="323.0" cy="483.9" r="5" fill="#F8F6EF" stroke="#203F48" stroke-width="2"/><text x="209.89999999999998" y="275.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="700" text-anchor="start">Complete shared commons</text><text x="209.89999999999998" y="318.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="start">Retain X -97..-63 / Z -384..-356</text><text x="368.79999999999995" y="466.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#203F48" font-weight="700" text-anchor="start">Existing door</text><text x="368.79999999999995" y="510.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">(-63, -370)</text><text x="131.6" y="657.9" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">4 m local lane</text><text x="368.79999999999995" y="710.0999999999999" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#547F80" font-weight="700" text-anchor="start">8 m shared cross-street</text><text x="588" y="184" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#203F48" font-weight="700" text-anchor="start">Located proposal</text><rect x="588" y="209" width="12" height="12" fill="#CBDCE5" stroke="#203F48" stroke-width="0.7"/><text x="617" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">G  Guest core reservation</text><text x="617" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">X -40..-34 / Z -386..-378</text><text x="617" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">6 x 8 m plan test; no lift count or passenger capacity inferred.</text><rect x="588" y="315" width="12" height="12" fill="#CBDCE5" stroke="#203F48" stroke-width="0.7"/><text x="617" y="331" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">GL  Guest landing</text><text x="617" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">X -40..-34 / Z -378..-374</text><text x="617" y="383" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">6 x 4 m, facing the retained cross-street. Aperture and moving-leaf pocket are</text><text x="617" y="406" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">unknown.</text><rect x="588" y="444" width="12" height="12" fill="#D6BCC7" stroke="#203F48" stroke-width="0.7"/><text x="617" y="460" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">S  Service core reservation</text><text x="617" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-48 / Z -386..-378</text><text x="617" y="512" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">6 x 8 m test; separate vertical staff use. Cart turn, doors and equipment are unsized.</text><rect x="588" y="550" width="12" height="12" fill="#D6BCC7" stroke="#203F48" stroke-width="0.7"/><text x="617" y="566" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">SL  Service landing</text><text x="617" y="595" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-48 / Z -378..-374</text><text x="617" y="618" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">6 x 4 m. Upper staff delivery still joins the shared public cross-street.</text><text x="588" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Keep the route hierarchy legible</text><text x="588" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">The X -44 lane remains between the bays with 2 m to each reservation. Both landings meet</text><text x="588" y="769.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">the full Z -374..-366 cross-street without reducing its drawn width. The commons door and</text><text x="588" y="792.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">allocation remain unchanged.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Dashed bays and landings are new proposals. Zero upper room-rectangle or ribbon intersections in the 2D screen; host feasibility is unproven.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  02</text></svg>