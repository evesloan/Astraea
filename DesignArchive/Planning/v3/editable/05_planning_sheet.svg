<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 5</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Protected footprints and the next interface decisions</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">R3 is a preferred coordinate-based test for one stack. It preserves the named programs and historical route strips in the available plan evidence, while</text><text x="62" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">keeping all missing host geometry explicit.</text><text x="62" y="161" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">Protected program beside the study</text><text x="62" y="199" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">D09</text><text x="174" y="199" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">Orchard market</text><text x="174" y="222" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-8 / Z -466..-398</text><text x="174" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">D09_market0</text><line x1="62" y1="254" x2="715" y2="254" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">D10</text><text x="174" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">The shared table / 240 places</text><text x="174" y="299" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-8 / Z -466..-398</text><text x="174" y="320" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">D10_dining0</text><line x1="62" y1="331" x2="715" y2="331" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">D11</text><text x="174" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">The music room</text><text x="174" y="376" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-8 / Z -384..-316</text><text x="174" y="397" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">D11_music</text><line x1="62" y1="408" x2="715" y2="408" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">D12</text><text x="174" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">Horizon room</text><text x="174" y="453" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-8 / Z -466..-398</text><text x="174" y="474" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">D12_observation0</text><line x1="62" y1="485" x2="715" y2="485" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="507" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">D12</text><text x="174" y="507" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">Listening salon</text><text x="174" y="530" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">X -54..-8 / Z -358..-290</text><text x="174" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">D12_listening2</text><line x1="62" y1="562" x2="715" y2="562" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#547F80" font-weight="700" text-anchor="start">D13-D17</text><text x="174" y="584" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">Complete port forward commons</text><text x="174" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">X -97..-63 / Z -384..-356</text><text x="174" y="628" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="start">Geometry-to-ID mapping unresolved</text><line x1="62" y1="639" x2="715" y2="639" stroke="#C9D3D0" stroke-width="1"/><text x="780" y="161" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">Before and after</text><text x="780" y="201" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">R1: conflicts with the lower service/staff ribbon. Rejected.</text><text x="780" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">R2: clears that ribbon but intersects D11 Music. Rejected as a</text><text x="780" y="253" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">continuous lower-to-upper core.</text><text x="780" y="279" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">R3: starts at D12, with new guest and staff approach stubs. Bays</text><text x="780" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">avoid protected plan footprints; the guest spur deliberately joins</text><text x="780" y="331" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">the sidewalk.</text><text x="780" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Hard evidence gates</text><text x="780" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Recover wall, floor/support and lift-pit geometry at Y78; no assumption</text><text x="780" y="431" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">that stopping above Music avoids an underfloor conflict.</text><text x="780" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Verify moving door clear span, clear head, leaf travel and cassette on</text><text x="780" y="488" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">each landing; no dimensions borrowed from salon fixtures.</text><text x="780" y="523" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Check actual cart/body turns and supported routes. Upper delivery</text><text x="780" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">shares the public cross-street; segregated back-of-house access is not</text><text x="780" y="567" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">established.</text><text x="780" y="602" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Recover upper hull and machinery/headroom; reconcile 1,000 units and</text><text x="780" y="624" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">81 luxury units by ID and real room geometry.</text><text x="62" y="687" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Door markers on the port public side remain X -8: market / dining / Horizon at Z -432;</text><text x="62" y="707" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Music at -350; Listening at -324.</text><text x="62" y="746" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">Planning to asset handoff</text><text x="62" y="780" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">Next useful kit: a paired guest landing return and service threshold/stow edge, parametric to the 6 x 4 m study landings. Preserve the 8 m</text><text x="62" y="804.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">cross-street and 4 m residential lane. Test a calm commons-facing guest identity beside a clearly serviceable cart-side interface before</text><text x="62" y="829.6800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">authoring shafts or moving mechanisms.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">D09 shops and upper guest rectangles are also screened and unchanged. No new room IDs, capacities, allocations, runtime geometry or floor cuts are produced.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  05</text></svg>