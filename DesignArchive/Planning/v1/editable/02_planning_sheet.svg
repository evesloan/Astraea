80406654343" y="340.10169491525426" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Public leisure and culture programs</text><text x="885.6580406654343" y="473.22033898305085" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Resort, gardens, care and habitats</text><text x="885.6580406654343" y="590.6779661016949" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Crew, engineering and logistics</text><line x1="257.82070240295747" y1="634" x2="257.82070240295747" y2="646" stroke="#B76543" stroke-width="2"/><text x="257.82070240295747" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#B76543" font-weight="400" text-anchor="middle">-432</text><line x1="479.41035120147876" y1="634" x2="479.41035120147876" y2="646" stroke="#B76543" stroke-width="2"/><text x="479.41035120147876" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#B76543" font-weight="400" text-anchor="middle">-216</text><line x1="627.1367837338262" y1="634" x2="627.1367837338262" y2="646" stroke="#B76543" stroke-width="2"/><text x="627.1367837338262" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#B76543" font-weight="400" text-anchor="middle">-72</text><line x1="922.5896487985212" y1="634" x2="922.5896487985212" y2="646" stroke="#B76543" stroke-width="2"/><text x="922.5896487985212" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#B76543" font-weight="400" text-anchor="middle">+216</text><line x1="1144.1792975970425" y1="634" x2="1144.1792975970425" y2="646" stroke="#B76543" stroke-width="2"/><text x="1144.1792975970425" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#B76543" font-weight="400" text-anchor="middle">+432</text><text x="146" y="702" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Townline stop Z coordinates (m). These are catchments, not hotel boundaries.</text><text x="62" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">Atrium: Z -64..+64, X -48..+48. Theater: Z -265..-115, X -118..-34,</text><text x="62" y="774.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">top Y 91.5 m. Existing D12-D14 floor openings and D12/D13 gallery</text><text x="62" y="799.6800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">interfaces stay protected. Vertical exaggeration 3.82x; no new</text><text x="62" y="824.5200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">openings.</text><text x="765" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">Still unresolved: upper hull clearance at every proposed building,</text><text x="765" y="774.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">local lift/stair shafts, multistory suite floor changes, court widths</text><text x="765" y="799.6800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">and the purpose of residual allocations. Every new vertical</text><text x="765" y="824.5200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">connection must be reconciled in plan and section.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Evidence: atlas pp. 2, 13-14, 21; source archive AUDITORIUMS.md and SHIP_DESIGN.md. Maximum envelope is not a roof design.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  02</text></svg>