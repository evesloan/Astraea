<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 6</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">A district-specific kit with a real interface</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">First paired target: D09 salon and starboard atrium arrival. Historical interfaces guide new adjustable components.</text><rect x="114.0" y="222.0" width="60.0" height="504.0" fill="#ECD6C6" stroke="#B76543" stroke-width="1"/><text x="144.0" y="270.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#B76543" font-weight="700" text-anchor="middle">TRAM</text><line x1="144.0" y1="294.0" x2="144.0" y2="726.0" stroke="#B76543" stroke-width="3"/><rect x="216.0" y="270.0" width="276.0" height="408.0" fill="none" stroke="#203F48" stroke-width="2"/><line x1="84.0" y1="474.0" x2="528.0" y2="474.0" stroke="#547F80" stroke-width="4"/><text x="360.0" y="354.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="middle">D09_salon5</text><text x="360.0" y="390.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="middle">46 x 68 m allocation</text><text x="360.0" y="564.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="middle">825.8 m2 guest enclosure</text><text x="360.0" y="594.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#B76543" font-weight="400" text-anchor="middle">final contour not recovered</text><circle cx="216.0" cy="474.0" r="6" fill="#F8F6EF" stroke="#547F80" stroke-width="2"/><circle cx="492.0" cy="474.0" r="6" fill="#F8F6EF" stroke="#B76543" stroke-width="2"/><text x="216.0" y="462.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#547F80" font-weight="400" text-anchor="middle">guest door</text><text x="492.0" y="501.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#B76543" font-weight="400" text-anchor="middle">service door</text><line x1="192.0" y1="390.0" x2="192.0" y2="558.0" stroke="#547F80" stroke-width="5"/><text x="84" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">X increases toward the starboard hull; Z increases downward</text><text x="84" y="773" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="700" text-anchor="start">28 m connected terrace at Z -14..+14</text><text x="84" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X35..45 tram reserve and the Z0 arrival/service axis</text><text x="84" y="812.08" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">stay clear.</text><text x="620" y="171" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">Six tailored junctions and built-ins</text><text x="620" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#547F80" font-weight="700" text-anchor="start">01</text><text x="661" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Deep public portal return</text><text x="661" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Meet the existing X52 entry and preserve its turning landing.</text><text x="620" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#547F80" font-weight="700" text-anchor="start">02</text><text x="661" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Coved wall-to-ceiling transition</text><text x="661" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Rib, light channel and soffit share a real joined profile.</text><text x="620" y="373" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#547F80" font-weight="700" text-anchor="start">03</text><text x="661" y="373" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Quiet book-and-acoustic return</text><text x="661" y="401" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Integrate shelf depth, sheltered seating edge and local light.</text><text x="620" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#547F80" font-weight="700" text-anchor="start">04</text><text x="661" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Planted court-to-seat junction</text><text x="661" y="480" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Connect garden edge and usable resting place without a new room.</text><text x="620" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#547F80" font-weight="700" text-anchor="start">05</text><text x="661" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Terrace rail-to-portal terminal</text><text x="661" y="559" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Resolve the actual garden-facing threshold and guard seam.</text><text x="620" y="610" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#547F80" font-weight="700" text-anchor="start">06</text><text x="661" y="610" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">Protected service/storage return</text><text x="661" y="638" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Frame the X98 service access with useful, shallow support depth.</text><text x="620" y="724" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">Height evidence: D09 floor +52.5 m; D10 +61 m; archived usable budget 8.25 m.</text><text x="620" y="747.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">Later component brief limits a quiet booth to 7.2 x 5.4 x 3.8 m and a tea bay to 6 x 3</text><text x="620" y="770.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">x 3.2 m. These are historical authoring limits, not proof of recovered fit.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Sources: D09_CONNECTED_SALON.md; D09_COMPOSITION_CONTRACT.md. Warm ivory / blue-green recess / warm wood / restrained brass.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  06</text></svg>