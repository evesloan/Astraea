<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 7</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Moonwell and Vesper remain in the district plan</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Preserve the pre-loss design relationships without inventing their missing shafts, room boundaries, floor openings or water geometry.</text><text x="62" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#203F48" font-weight="700" text-anchor="start">Moonwell   three-level neighborhood</text><rect x="62" y="211" width="585" height="130" fill="#E8D7A8" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="79" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">D10 +61 m</text><text x="79" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Lantern cafe in conversation</text><text x="79" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Historical ID candidate: D10_banquet2</text><text x="79" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Archive name: Lantern restaurant / 240 places</text><rect x="62" y="385" width="585" height="130" fill="#CBDCE5" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="79" y="414" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">D09 +52.5 m</text><text x="79" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Paper Moon bookshop</text><text x="79" y="463" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D09_books2 / Paper moon books</text><text x="79" y="485" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Quiet browsing and shared social threshold</text><rect x="62" y="559" width="585" height="130" fill="#BDD2BD" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="79" y="588" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">D08 +44 m</text><text x="79" y="615" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Mineral baths / springs</text><text x="79" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D08_bath2 / Mineral springs</text><text x="79" y="659" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Wet/dry threshold and towel/service approach</text><line x1="350" y1="346" x2="350" y2="380" stroke="#826A96" stroke-width="3" stroke-dasharray="7,5"/><polygon points="350,380 345.6851701525622,372.10175694298664 354.3148298474378,372.10175694298664" fill="#826A96" stroke="#826A96" stroke-width="1"/><line x1="350" y1="520" x2="350" y2="554" stroke="#826A96" stroke-width="3" stroke-dasharray="7,5"/><polygon points="350,554 345.6851701525622,546.1017569429866 354.3148298474378,546.1017569429866" fill="#826A96" stroke="#826A96" stroke-width="1"/><text x="62" y="733" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">These are a historical conversation grouping plus surviving ID</text><text x="62" y="757.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">candidates. A physical shared court, local lift, stair or open void</text><text x="62" y="782.6800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">has not been recovered. Exact room-name equivalence needs</text><text x="62" y="807.5200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">review.</text><text x="762" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#203F48" font-weight="700" text-anchor="start">Vesper   dining and aquatic connection</text><rect x="762" y="211" width="616" height="164" fill="#D6BCC7" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="779" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Vesper restaurant / 240 places</text><text x="779" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D10_banquet7 is the surviving Vesper dining record. The conversation</text><text x="779" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">reports two levels and a connected waterfall. The second level and</text><text x="779" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">waterfall route are not established by the archived allocation.</text><line x1="1070" y1="379" x2="1070" y2="459" stroke="#826A96" stroke-width="3" stroke-dasharray="7,5"/><polygon points="1070,459 1065.6851701525623,451.10175694298664 1074.3148298474377,451.10175694298664" fill="#826A96" stroke="#826A96" stroke-width="1"/><text x="1110" y="422" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#826A96" font-weight="400" text-anchor="start">Historical connection</text><rect x="762" y="469" width="616" height="111" fill="#CBDCE5" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="779" y="498" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Aquatic district</text><text x="779" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">A real adjacency goal to preserve. Do not equate the visual waterfall</text><text x="779" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">with a proven fluid system, floor opening or navigable route.</text><text x="762" y="629" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#203F48" font-weight="700" text-anchor="start">What this should drive in the next kit</text><text x="762" y="664" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">A coordinated wet-to-dry threshold family; quiet bookshop edge;</text><text x="762" y="688.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">cafe service front; stacked wayfinding; rail/soffit transitions; and a</text><text x="762" y="713.6800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">water-facing dining edge. First establish the interface dimensions</text><text x="762" y="738.5200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">and actual neighboring rooms, then author the connected</text><text x="762" y="763.3600000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="400" text-anchor="start">components together.</text><text x="762" y="791" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">Do not count a new cafe or another 240 seats from a naming</text><text x="762" y="814.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">difference.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Sources: surviving IDs in whole_ship_coverage.json; historical conversation reports. Dashed links are unverified connections.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  07</text></svg>