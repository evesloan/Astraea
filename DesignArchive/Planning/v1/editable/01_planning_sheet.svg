<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 1</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Astraea as connected districts</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">A program and relationship study. Existing destinations anchor the plan; hotel buildings and new local connections remain proposals.</text><rect x="62" y="165" width="355" height="135" fill="#CBDCE5" stroke="#203F48" stroke-width="1.3"/><text x="79" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Homes and habitats</text><text x="79" y="221" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D04 aquatic / arboreal homes</text><text x="79" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D13-D17 residential neighborhoods</text><text x="79" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Known homes; grouping remains open</text><rect x="540" y="165" width="360" height="135" fill="#BDD2BD" stroke="#203F48" stroke-width="1.3"/><text x="557" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Grand botanical atrium</text><text x="557" y="221" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D02-D17 shared vertical landmark</text><text x="557" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Main terraces D06 / D09 / D12 / D16</text><text x="557" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Gardens, courts, reading and family</text><text x="557" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">edges</text><rect x="1023" y="165" width="355" height="135" fill="#E8D7A8" stroke="#203F48" stroke-width="1.3" stroke-dasharray="7,5"/><text x="1040" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Distinct hotel buildings</text><text x="1040" y="221" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Alternatives A and B on sheets 3-4</text><text x="1040" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Local guest cores and service access</text><text x="1040" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Exact rooms and tiers remain open</text><line x1="240" y1="302" x2="240" y2="350" stroke="#547F80" stroke-width="3"/><polygon points="240,350 235.68517015256216,342.10175694298664 244.31482984743784,342.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="720" y1="302" x2="720" y2="350" stroke="#547F80" stroke-width="3"/><polygon points="720,350 715.6851701525621,342.10175694298664 724.3148298474379,342.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="1200" y1="302" x2="1200" y2="350" stroke="#547F80" stroke-width="3" stroke-dasharray="7,5"/><polygon points="1200,350 1195.6851701525623,342.10175694298664 1204.3148298474377,342.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><line x1="88" y1="389" x2="1352" y2="389" stroke="#547F80" stroke-width="8"/><text x="720" y="369" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="700" text-anchor="middle">SHARED GUEST NETWORK</text><text x="720" y="624" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="middle">Longitudinal promenades + five Townline catchments + existing express deck travel</text><line x1="217" y1="390" x2="217" y2="481" stroke="#547F80" stroke-width="2"/><polygon points="217,481 212.68517015256216,473.10175694298664 221.31482984743784,473.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><rect x="62" y="482" width="311" height="112" fill="#CBDCE5" stroke="#203F48" stroke-width="1.3"/><text x="79" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Active resort</text><text x="79" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D07 sport / movement</text><text x="79" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D08 pool / baths / wellness</text><line x1="552" y1="390" x2="552" y2="481" stroke="#547F80" stroke-width="2"/><polygon points="552,481 547.6851701525621,473.10175694298664 556.3148298474379,473.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><rect x="397" y="482" width="311" height="112" fill="#E8D7A8" stroke="#203F48" stroke-width="1.3"/><text x="414" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Retail and local courts</text><text x="414" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D09 100 shops + 10 destinations</text><text x="414" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Markets, books, cafes, services</text><line x1="887" y1="390" x2="887" y2="481" stroke="#547F80" stroke-width="2"/><polygon points="887,481 882.6851701525621,473.10175694298664 891.3148298474379,473.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><rect x="732" y="482" width="311" height="112" fill="#E8D7A8" stroke="#203F48" stroke-width="1.3"/><text x="749" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Dining and hospitality</text><text x="749" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D10 ten venues / 2,200 places</text><text x="749" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Food, social rooms, serving edges</text><line x1="1222" y1="390" x2="1222" y2="481" stroke="#547F80" stroke-width="2"/><polygon points="1222,481 1217.6851701525623,473.10175694298664 1226.3148298474377,473.10175694298664" fill="#547F80" stroke="#547F80" stroke-width="1"/><rect x="1067" y="482" width="311" height="112" fill="#D6BCC7" stroke="#203F48" stroke-width="1.3"/><text x="1084" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Culture and outlooks</text><text x="1084" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D11 theater / six cinemas</text><text x="1084" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">D12 library / salons / observation</text><text x="62" y="650" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#203F48" font-weight="700" text-anchor="start">Historical vertical relationships to retain in the study</text><text x="62" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">Moonwell: D08 mineral springs + D09 Paper Moon books + D10 Lantern cafe. Vesper: 240-place restaurant, two levels and a waterfall</text><text x="62" y="704.84" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#5F7274" font-weight="400" text-anchor="start">connection to the aquatic district. Connections and exact geometry need reconciliation; see sheet 7.</text><line x1="88" y1="772" x2="1352" y2="772" stroke="#B76543" stroke-width="6" stroke-dasharray="10,6"/><text x="720" y="753" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#B76543" font-weight="700" text-anchor="middle">SEPARATE SERVICE NETWORK</text><text x="720" y="807" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="middle">D01 logistics / laundry / supplies   |   D02 engineering   |   D03 crew homes   |   D05 care   |   D18 command</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Evidence: atlas pp. 1-21; master chapters 4-7; latest user direction. Lines show relationships, not approved physical routes.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  01</text></svg>