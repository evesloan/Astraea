<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 8</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">One connected assembly to test first</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">An adjustable proposal joining arrival, reading bay and planted return. All positions need recovered-boundary review.</text><text x="62" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">Plan   connected threshold and bay</text><line x1="137" y1="422" x2="545" y2="422" stroke="#547F80" stroke-width="3"/><rect x="137" y="388" width="408" height="68" fill="#E2EBE5" stroke="#547F80" stroke-width="1" stroke-dasharray="6,4"/><text x="341" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#547F80" font-weight="700" text-anchor="middle">4 m STUDY CLEAR STRIP</text><line x1="205" y1="218" x2="205" y2="626" stroke="#203F48" stroke-width="2"/><circle cx="205" cy="422" r="6" fill="#F8F6EF" stroke="#203F48" stroke-width="2"/><text x="205" y="449" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="middle">X52 guest door</text><rect x="341" y="296.2" width="122.4" height="91.80000000000001" fill="#CBDCE5" stroke="#203F48" stroke-width="1.5" stroke-dasharray="7,4"/><text x="402.20000000000005" y="330.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="700" text-anchor="middle">Quiet bay</text><text x="402.20000000000005" y="357.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="middle">7.2 x 5.4 m max</text><rect x="341" y="456" width="122.4" height="42.5" fill="#BDD2BD" stroke="#203F48" stroke-width="1.5" stroke-dasharray="7,4"/><text x="402.20000000000005" y="483.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#203F48" font-weight="700" text-anchor="middle">Planted return</text><line x1="205" y1="388" x2="341" y2="388" stroke="#547F80" stroke-width="5" stroke-dasharray="7,4"/><text x="273" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="middle">portal / cove chain</text><text x="137" y="654.9" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Terrace</text><text x="392" y="654.9" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Room-side study</text><text x="62" y="713" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">New study coordinates: quiet bay X60..67.2 / Z-7.4..-2; planted return</text><text x="62" y="736.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">X60..67.2 / Z+2..+4.5. The final 825.8 m2 room contour is missing, so</text><text x="62" y="759.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">these are candidate positions only.</text><text x="773" y="166" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#203F48" font-weight="700" text-anchor="start">Section   low bay and clear route</text><line x1="800" y1="551" x2="1361" y2="551" stroke="#203F48" stroke-width="2"/><line x1="800" y1="270.5" x2="1361" y2="270.5" stroke="#5F7274" stroke-width="1.2" stroke-dasharray="5,4"/><text x="800" y="258.5" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">8.25 m historical usable-height budget</text><line x1="852.8" y1="551" x2="852.8" y2="421.8" stroke="#203F48" stroke-width="3" stroke-dasharray="7,4"/><line x1="852.8" y1="421.8" x2="1031" y2="421.8" stroke="#203F48" stroke-width="3" stroke-dasharray="7,4"/><rect x="852.8" y="532.3" width="46.199999999999996" height="18.700000000000003" fill="#CBDCE5" stroke="#203F48" stroke-width="1" stroke-dasharray="7,4"/><rect x="1163" y="513.6" width="82.5" height="37.400000000000006" fill="#BDD2BD" stroke="#203F48" stroke-width="1" stroke-dasharray="7,4"/><text x="852.8" y="406.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#203F48" font-weight="400" text-anchor="start">Joined shelf / seat / cove</text><text x="1097" y="500.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#547F80" font-weight="700" text-anchor="middle">CLEAR</text><text x="1097" y="523.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5F7274" font-weight="400" text-anchor="middle">4 m study</text><text x="800" y="579" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">D09 +52.5 m   |   Z cross-section at proposed X64</text><text x="773" y="616" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">The low bay uses the later 3.8 m maximum booth brief. Its ceiling</text><text x="773" y="639.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">must terminate into the enclosing return, with a joined light channel.</text><text x="773" y="662.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">The wider room ceiling remains unresolved.</text><text x="773" y="723" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">Preserve the actual door aperture, turn landings, Z0 route, X35..45</text><text x="773" y="746.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">tram reserve and both service/public doors. The 4 m strip is a</text><text x="773" y="769.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">proposed QA allowance, not a proven body/cart clearance result.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Historical baseline + later component brief; all colored assembly locations and 4 m study strip are NEW proposals requiring fit review.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  08</text></svg>