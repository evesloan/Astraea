<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 3</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Alternative A   Three distinct hotels with a deeper public base</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">A proposal for two different forward hotels and one quieter aft hotel. Strong individual identity; greater conflict-review burden on public decks.</text><polygon points="92.0,267.64000059160054 117.41998852178902,223.35997726397824 183.01996497376646,190.5599953135955 289.6198812100863,184.0000290464278 740.6197208863329,184.0000290464278 880.0199579557598,197.12006199045933 953.8196788710926,237.30000599140573 979.2399999999999,277.4800001972002 979.2399999999999,287.31999980279977 953.8196788710926,327.49996890617024 880.0199579557598,367.67993800954065 740.6197208863329,380.79997095357214 289.6198812100863,380.79997095357214 183.01996497376646,374.2399293791324 117.41998852178902,341.4399976335977 92.0,297.1599994083994" fill="#EBECE5" stroke="#203F48" stroke-width="1.6"/><rect x="92.0" y="272.56" width="887.2399999999999" height="19.68" fill="#E0E7E3" stroke="none" stroke-width="1"/><rect x="483.14" y="243.04" width="104.96" height="78.72" fill="#F8F6EF" stroke="#547F80" stroke-width="2"/><text x="535.6199999999999" y="278.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#547F80" font-weight="700" text-anchor="middle">ATRIUM</text><rect x="318.32" y="185.64" width="122.99999999999999" height="68.88" fill="#D6BCC7" stroke="#203F48" stroke-width="1.3"/><text x="379.82" y="212.7" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#203F48" font-weight="700" text-anchor="middle">THEATER</text><line x1="92.0" y1="282.4" x2="476.58" y2="282.4" stroke="#B76543" stroke-width="2"/><line x1="476.58" y1="282.4" x2="489.7" y2="282.4" stroke="#B76543" stroke-width="2"/><line x1="489.7" y1="282.4" x2="492.97999999999996" y2="315.2" stroke="#B76543" stroke-width="2"/><line x1="492.97999999999996" y1="315.2" x2="578.26" y2="315.2" stroke="#B76543" stroke-width="2"/><line x1="578.26" y1="315.2" x2="581.54" y2="282.4" stroke="#B76543" stroke-width="2"/><line x1="581.54" y1="282.4" x2="594.66" y2="282.4" stroke="#B76543" stroke-width="2"/><line x1="594.66" y1="282.4" x2="979.2399999999999" y2="282.4" stroke="#B76543" stroke-width="2"/><circle cx="181.38" cy="282.4" r="3.4" fill="#F8F6EF" stroke="#B76543" stroke-width="1.5"/><circle cx="358.5" cy="282.4" r="3.4" fill="#F8F6EF" stroke="#B76543" stroke-width="1.5"/><circle cx="476.58" cy="282.4" r="3.4" fill="#F8F6EF" stroke="#B76543" stroke-width="1.5"/><circle cx="712.74" cy="282.4" r="3.4" fill="#F8F6EF" stroke="#B76543" stroke-width="1.5"/><circle cx="889.8599999999999" cy="282.4" r="3.4" fill="#F8F6EF" stroke="#B76543" stroke-width="1.5"/><text x="92" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">BOW  Z -541 m</text><text x="979.2399999999999" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="end">STERN  Z +541 m</text><text x="535.6199999999999" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="middle">PORT (-X) ABOVE   |   STARBOARD (+X) BELOW</text><rect x="174.82" y="205.32" width="122.99999999999999" height="60.68" fill="#E8D7A8" stroke="#203F48" stroke-width="1.7" stroke-dasharray="7,4"/><text x="236.32" y="240.66" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="700" text-anchor="middle">A1</text><rect x="240.42" y="298.8" width="205.0" height="68.88" fill="#CBDCE5" stroke="#203F48" stroke-width="1.7" stroke-dasharray="7,4"/><text x="342.91999999999996" y="338.24" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="700" text-anchor="middle">A2</text><rect x="634.02" y="197.12" width="188.6" height="68.88" fill="#BDD2BD" stroke="#203F48" stroke-width="1.7" stroke-dasharray="7,4"/><text x="728.3199999999999" y="236.56" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#203F48" font-weight="700" text-anchor="middle">A3</text><text x="92" y="420" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Plan-hull contour traced from the atlas. All colored hotel zones are NEW study allocations.</text><text x="92" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Tram bypass simplified; sculpted supporting floor ring omitted. No collision claim.</text><text x="1035" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">A1  Forward port hotel</text><text x="1035" y="204" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Z -440 to -290 m</text><text x="1035" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X -94 to -20 m | D09-D17</text><text x="1035" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">A2  Forward starboard hotel</text><text x="1035" y="285" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Z -360 to -110 m</text><text x="1035" y="307" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X 20 to 104 m | D09-D17</text><text x="1035" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#203F48" font-weight="700" text-anchor="start">A3  Aft garden hotel</text><text x="1035" y="366" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">Z 120 to 350 m</text><text x="1035" y="388" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5F7274" font-weight="400" text-anchor="start">X -104 to -20 m | D12-D17</text><rect x="92" y="476" width="887" height="196" fill="none" stroke="#5F7274" stroke-width="1.2" stroke-dasharray="6,5"/><line x1="92" y1="672.0" x2="979" y2="672.0" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="676.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D01</text><line x1="92" y1="584.7966101694915" x2="979" y2="584.7966101694915" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="588.7966101694915" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D09</text><line x1="92" y1="556.5593220338983" x2="979" y2="556.5593220338983" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="560.5593220338983" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D11</text><line x1="92" y1="542.4406779661017" x2="979" y2="542.4406779661017" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="546.4406779661017" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D12</text><line x1="92" y1="532.4745762711864" x2="979" y2="532.4745762711864" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="536.4745762711864" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D13</text><line x1="92" y1="510.0508474576271" x2="979" y2="510.0508474576271" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="514.0508474576271" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D16</text><line x1="92" y1="495.10169491525426" x2="979" y2="495.10169491525426" stroke="#C9D3D0" stroke-width="1"/><text x="85" y="499.10169491525426" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#5F7274" font-weight="400" text-anchor="end">D18</text><rect x="174.79759704251387" y="495.10169491525426" width="122.96672828096118" height="89.69491525423729" fill="#E8D7A8" stroke="#203F48" stroke-width="1.5" stroke-dasharray="7,4"/><text x="236.28096118299445" y="487.10169491525426" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="middle">A1</text><rect x="240.37985212569316" y="495.10169491525426" width="204.9445471349353" height="89.69491525423729" fill="#CBDCE5" stroke="#203F48" stroke-width="1.5" stroke-dasharray="7,4"/><text x="342.8521256931608" y="487.10169491525426" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="middle">A2</text><rect x="633.873382624769" y="495.10169491525426" width="188.54898336414047" height="47.33898305084746" fill="#BDD2BD" stroke="#203F48" stroke-width="1.5" stroke-dasharray="7,4"/><text x="728.1478743068392" y="487.10169491525426" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#203F48" font-weight="700" text-anchor="middle">A3</text><rect x="483.03419593345654" y="495.10169491525426" width="104.93160813308688" height="166.9322033898305" fill="#F8F6EF" stroke="#547F80" stroke-width="1.5"/><rect x="318.2587800369686" y="520.0169491525423" width="122.96672828096118" height="36.54237288135593" fill="#D6BCC7" stroke="#203F48" stroke-width="1.3"/><text x="92" y="705" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#5F7274" font-weight="400" text-anchor="start">Projected section. Same-Z port/starboard hotels overlap here; they are separate masses in plan.</text><text x="1035" y="502" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#203F48" font-weight="700" text-anchor="start">No room counts assigned</text><text x="1035" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">The 1,000-unit ledger remains whole.</text><text x="1035" y="561.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">These envelopes test relationships;</text><text x="1035" y="584.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">they do not absorb or delete existing</text><text x="1035" y="608.3800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">destinations.</text><text x="1035" y="632" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">Upper hull fit and local shafts are</text><text x="1035" y="655.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">unresolved. No floor cuts, bridges or</text><text x="1035" y="678.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">lift cabins are approved by these</text><text x="1035" y="702.3800000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#B76543" font-weight="400" text-anchor="start">boxes.</text><text x="62" y="754" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">Opportunity: Distinct scales and arrivals; hotel life can overlap retail,</text><text x="62" y="777.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">dining and culture without making one enormous undifferentiated</text><text x="62" y="800.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">accommodation bar.</text><text x="755" y="754" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">Review before choosing: A1/A2 study volumes include existing D09-D12</text><text x="755" y="777.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">programs. Cinemas, shops, dining and observation remain protected</text><text x="755" y="800.9200000000001" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">allocations until exact IDs and alternatives are reviewed.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Base: atlas p. 13 hull and protected geometry. Hotel coordinates/heights are explicit proposals. Not a final 1,000-room allocation.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  03</text></svg>