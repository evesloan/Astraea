<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img"><title>Astraea planning sheet 5</title><rect x="0" y="0" width="1440" height="900" fill="#F8F6EF" stroke="none" stroke-width="1"/><text x="62" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#203F48" font-weight="700" text-anchor="start">Allocation and constraint ledger</text><text x="62" y="97" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5F7274" font-weight="400" text-anchor="start">One authoritative program, with dated evidence separated from new proposals. All 1,462 surviving IDs are preserved in the editable crosswalk.</text><rect x="62" y="158" width="288" height="41" fill="#203F48" stroke="none" stroke-width="1"/><text x="75" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Item</text><rect x="350" y="158" width="615" height="41" fill="#203F48" stroke="none" stroke-width="1"/><text x="363" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Established or retained baseline</text><rect x="965" y="158" width="413" height="41" fill="#203F48" stroke="none" stroke-width="1"/><text x="978" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Open decision / action</text><rect x="62" y="199" width="288" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Hull and decks</text><rect x="350" y="199" width="615" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">18 decks; 1,082 m length; 240 m max beam; 118 m envelope</text><rect x="965" y="199" width="413" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="216" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Use exact floor elevations; verify local roof/side</text><text x="977" y="233" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">clearance</text><rect x="62" y="244" width="288" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Guest accommodation</text><rect x="350" y="244" width="615" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">1,000 units; 81 luxury included, not additional</text><rect x="965" y="244" width="413" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="261" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">50 deluxe / 25 premium / 5 royalty / 1 supreme; exact</text><text x="977" y="278" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">rooms open</text><rect x="62" y="289" width="288" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Population</text><rect x="350" y="289" width="615" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">2,000 hard passenger cap; normal 1,200-2,000</text><rect x="965" y="289" width="413" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Do not revive historic 2,500 maximum or force full</text><text x="977" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">occupancy</text><rect x="62" y="334" width="288" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Crew homes</text><rect x="350" y="334" width="615" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">400 crew including player; player shares a staff room</text><rect x="965" y="334" width="413" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="351" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Old private-player-cabin allocation needs explicit</text><text x="977" y="368" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">reconciliation</text><rect x="62" y="379" width="288" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Atrium</text><rect x="350" y="379" width="615" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">96 x 128 m opening D02-D17; principal terraces 06/09/12/16</text><rect x="965" y="379" width="413" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="396" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Purposeful courts and edges; preserve open volume</text><text x="977" y="413" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">and interfaces</text><rect x="62" y="424" width="288" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Theater</text><rect x="350" y="424" width="615" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">2,200 places; 84 x 150 x 22 m; D12-D14 floor openings</text><rect x="965" y="424" width="413" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="441" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Protect D12/D13 gallery interfaces, access and</text><text x="977" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">residential detours</text><rect x="62" y="469" width="288" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Retail and dining</text><rect x="350" y="469" width="615" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">100 shops + 10 larger D09 places; D10 has 2,200 meal places</text><rect x="965" y="469" width="413" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Reconcile actual footprints before any hotel overlap</text><rect x="62" y="514" width="288" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Transport</text><rect x="350" y="514" width="615" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Five Townline catchments; express interface; tram bypass</text><rect x="965" y="514" width="413" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="531" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Local hotel cores need footprints; panoramic lifts not</text><text x="977" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">verified</text><rect x="62" y="559" width="288" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Hotel alternatives</text><rect x="350" y="559" width="615" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">A: three study hotels; B: four smaller study hotels</text><rect x="965" y="559" width="413" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">No chosen scheme, assigned IDs, capacity or approved</text><text x="977" y="593" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">new holes</text><rect x="62" y="604" width="288" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Luxury sections</text><rect x="350" y="604" width="615" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Multistory upper-level rooms are current direction</text><rect x="965" y="604" width="413" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="621" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Exact floor relationships, suite sizes and privacy need</text><text x="977" y="638" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">review</text><rect x="62" y="649" width="288" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Moonwell / Vesper</text><rect x="350" y="649" width="615" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Historical district links and Vesper 240-place program retained</text><rect x="965" y="649" width="413" height="45" fill="#FFFFFF" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="666" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Names, multi-level boundaries and water connection</text><text x="977" y="683" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">unresolved</text><rect x="62" y="694" width="288" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="74" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Asset planning</text><rect x="350" y="694" width="615" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="362" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#203F48" font-weight="400" text-anchor="start">Catalogue components can be tailored while planning evolves</text><rect x="965" y="694" width="413" height="45" fill="#EEF1ED" stroke="#C9D3D0" stroke-width="0.7"/><text x="977" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">Keep mating interfaces adjustable; no claimed game</text><text x="977" y="728" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#5F7274" font-weight="400" text-anchor="start">adoption</text><text x="62" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">Crosswalk discipline: existing_id and historical program remain unchanged; proposed_hotel_id is null for every record. New hotel membership needs</text><text x="62" y="801.46" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#203F48" font-weight="400" text-anchor="start">explicit reconciliation. Older room-class and crew-home assumptions are retained as history, not silently adopted as latest canon.</text><line x1="62" y1="849" x2="1378" y2="849" stroke="#C9D3D0" stroke-width="1"/><text x="62" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="start">Evidence: latest user canon; atlas; master source archive coverage ledger. Historical source checks do not verify a recovered runtime.</text><text x="1378" y="874" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" fill="#5F7274" font-weight="400" text-anchor="end">STUDY  |  02 OCT 2026  |  05</text></svg>